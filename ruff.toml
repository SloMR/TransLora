# Ruff config for the Python CLI. At the repo root so `ruff check .` works from
# anywhere and the web half of the tree is never scanned.

target-version = "py310"  # matches requires-python in cli/pyproject.toml
line-length = 100

extend-exclude = [".venv", "venv", "**/.mypy_cache", "**/.pytest_cache"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "C4", "RUF"]

# TransLora translates subtitles into non-Latin scripts; an Arabic alef in a
# fixture is the subject matter, not a homoglyph attack.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# The long lines are the literal prompt text — wrapping would change the prompt.
"cli/core/prompt.py" = ["E501"]
# A pytest fixture requested only for its side effect looks like a dead parameter.
"cli/tests/*" = ["ARG001", "ARG002", "ARG005"]

[lint.isort]
known-first-party = ["core"]
