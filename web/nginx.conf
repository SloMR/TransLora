# nginx drops every inherited add_header in a location that adds one of its own,
# so cache policy is a server-level map rather than per-location Cache-Control.
map $uri $translora_cache {
    default                                                       "no-store";
    "~*-[A-Za-z0-9]{8}\.(?:js|css)$"                              "public, max-age=31536000, immutable";
    "~*\.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$"  "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/woff2;

    # connect-src * is deliberate: the provider base URL is supplied by the user at
    # runtime. The sha256 covers index.html's one inline handler — CI checks it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $translora_cache always;

    # SPA fallback: every unknown path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset-shaped paths must 404 here; via the fallback a missing .json would
    # answer 200 with an HTML body.
    location ~* \.(?:js|mjs|css|map|json|webmanifest|wasm|txt|xml|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        try_files $uri =404;
    }
}
