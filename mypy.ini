# Mypy config for the Python CLI. At the repo root so `mypy` needs no arguments
# and the web half of the tree is never scanned.

[mypy]
# setuptools writes the editable build of cli/ here; a copy, not code to check.
exclude = (^|/)build/
python_version = 3.10
files = cli
# translora.py imports `core.*` by its script-local name, so cli/ is the root.
mypy_path = cli

check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
extra_checks = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True
warn_unreachable = True
disallow_subclassing_any = True
disallow_untyped_decorators = True

# The tests hand deliberate stand-ins to typed helpers (None for an
# httpx.AsyncClient, a local _StubCfg for a TranslationConfig), so those call
# sites are wrong on purpose.
[mypy-tests.*]
check_untyped_defs = False
disable_error_code = arg-type
